name: Invista Full Platform Audit
# Audit revision: current-main validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: invista-full-platform-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  full-platform-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: audit
          POSTGRES_PASSWORD: auditaudit
          POSTGRES_DB: audit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U audit -d audit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Git repository integrity
        run: git fsck --full --no-progress

      - name: Repository-wide structural scan
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            test -e "$file" || { echo "MISSING: $file"; exit 1; }
            case "$file" in
              *.js|*.mjs|*.cjs)
                node --check "$file"
                ;;
              *.json)
                node -e 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"))' "$file"
                ;;
              *.sh)
                bash -n "$file"
                ;;
              *.py)
                python -m py_compile "$file"
                ;;
            esac
            case "$file" in
              *.yml|*.yaml)
                ruby -e 'require "yaml"; YAML.load_file(ARGV[0]);' "$file"
                ;;
              *.toml|.replit)
                python -c 'import sys,tomllib; tomllib.loads(open(sys.argv[1],"rb").read().decode())' "$file"
                ;;
              .node-version)
                python -c 'import sys,re; v=open(sys.argv[1],"r",encoding="utf-8").read().strip(); assert re.fullmatch(r"[0-9]+(?:\.[0-9]+){0,2}", v), "invalid .node-version: "+v' "$file"
                ;;
            esac

            case "$file" in
              *.ts|*.tsx|*.js|*.mjs|*.cjs|*.json|*.yml|*.yaml|*.sh|*.py|*.css|*.html|*.md|*.txt|*.toml)
                if grep -nE '^(<<<<<<< |=======$|>>>>>>> )' "$file" >/dev/null 2>&1; then
                  echo "MERGE CONFLICT MARKER: $file"
                  exit 1
                fi
                ;;
            esac
            count=$((count+1))
          done < <(git ls-files -z)
          echo "Repository-wide scan completed: $count tracked files inspected."

      - name: Validate lockfile consistency
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          git diff --exit-code -- package-lock.json
          echo "package-lock.json is consistent with package.json."

      - name: Clean dependency install
        run: npm ci

      - name: TypeScript validation
        run: npm run check

      - name: Run application tests when declared
        shell: bash
        run: |
          if node -e 'process.exit(require("./package.json").scripts?.test ? 0 : 1)'; then
            npm test
          else
            echo "::warning::No application test script is declared in package.json; structural, type, build, security, and smoke tests remain mandatory."
          fi

      - name: Production build
        run: npm run build

      - name: Production dependency vulnerability scan
        run: npm audit --omit=dev --audit-level=high

      - name: Full dependency vulnerability report
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Verify production artifact
        shell: bash
        run: |
          test -f dist/index.js
          test -f dist/trading-user-worker.js
          test -f dist/public/index.html
          echo "Production artifact checks passed."

      - name: Verify final working tree
        run: git diff --exit-code

      - name: Production boot smoke test
        shell: bash
        env:
          NODE_ENV: production
          PORT: 5123
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          SESSION_SECRET: github-actions-smoke-test-secret-32-characters
          DERIV_APP_ID: "123456"
          DERIV_API_KEY_DEMO: "audit-demo-token"
          DERIV_API_KEY_REAL: "audit-real-token"
          DATABASE_URL: "postgresql://audit:auditaudit@127.0.0.1:5432/audit"
          INVISTA_PLATFORM: "v10"
          ADMIN_EMAIL: "audit@example.invalid"
          SENDGRID_API_KEY: "SG.audit"
          HUGGINGFACE_API_KEY: "hf_audit"
          UNIVERSAL_SERVER_URL: "http://127.0.0.1:5123"
          INVISTA_UNIVERSAL_SERVER_KEY: "audit-universal-key"
          INTERNAL_DESKTOP_CTRL_SECRET: "audit-only-internal-desktop-secret"
          CI_STORAGE_SMOKE: "1"
        run: |
          set -euo pipefail
          npx tsx scripts/seed-neon-sqlite-smoke.ts
          node dist/index.js > /tmp/invista-server.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:5123/health > /tmp/health.json && grep -q '"readiness":"ready"' /tmp/health.json && grep -q '"persistenceReady":true' /tmp/health.json; then
              cat /tmp/health.json
              node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync("/tmp/health.json","utf8")); if(d.status!=="ok" || d.readiness!=="ready" || d.routesReady!==true || d.persistenceReady!==true || d.observability?.critical!==0){console.error("Production readiness check failed:",JSON.stringify(d,null,2));process.exit(1)}'

              curl -fsS http://127.0.0.1:5123/api/ping > /tmp/ping.txt
              test "$(cat /tmp/ping.txt)" = "OK" || { cat /tmp/ping.txt; echo "Ping endpoint invalid: expected OK"; exit 1; }

              curl -fsS http://127.0.0.1:5123/api/health > /tmp/api-health.json
              node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync("/tmp/api-health.json","utf8")); if(d.status!=="online" && d.status!=="not_ready"){console.error("API health endpoint invalid:",JSON.stringify(d));process.exit(1)}'

              curl -fsS http://127.0.0.1:5123/api/status > /tmp/status.json
              node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync("/tmp/status.json","utf8")); if(d.status!=="online"){console.error("Status endpoint invalid:",JSON.stringify(d));process.exit(1)}'

              node --input-type=module -e 'import Database from "better-sqlite3"; const db=new Database("database/investpro.db",{readonly:true}); const user=db.prepare("SELECT id FROM users WHERE id = ?").get("audit-neon-user-0000000000000000"); const token=db.prepare("SELECT is_active,is_primary FROM deriv_tokens WHERE id = ?").get("audit-neon-token-000000000000000"); const config=db.prepare("SELECT id FROM trade_configurations WHERE id = ?").get("audit-neon-config-00000000000000"); const moduleConfig=db.prepare("SELECT id FROM modality_module_configs WHERE id = ?").get("audit-neon-module-000000000000"); db.close(); if(!user || !token || Number(token.is_active)!==0 || Number(token.is_primary)!==1 || !config || !moduleConfig){console.error("Neon-to-SQLite restore failed:",JSON.stringify({user:!!user,token:!!token,tokenInactive:token?Number(token.is_active)===0:false,tokenPrimary:token?Number(token.is_primary)===1:false,config:!!config,moduleConfig:!!moduleConfig}));process.exit(1)} console.log("Neon-to-SQLite restore smoke passed: user, inactive primary-marked encrypted token, trade configuration, and modality configuration restored.");'

              node --input-type=module -e 'import postgres from "postgres"; const sql=postgres(process.env.DATABASE_URL); const rows=await sql.unsafe("SELECT platform_id, essential_backfill_completed_at FROM invista_database_identity WHERE id=1"); await sql.end(); const identity=rows[0]; if(identity?.platform_id!=="invista-core" || !identity.essential_backfill_completed_at){console.error("Neon identity/backfill marker invalid:",JSON.stringify({platformId:identity?.platform_id,backfillComplete:!!identity?.essential_backfill_completed_at}));process.exit(1)} console.log("Neon shared identity and backfill marker verified.");'

              code=$(curl -s -o /tmp/admin-anon.json -w "%{http_code}" http://127.0.0.1:5123/api/trading/account-info)
              case "$code" in 401|403) echo "Anonymous trading access correctly denied: HTTP $code" ;; *) cat /tmp/admin-anon.json; echo "Expected 401/403 for anonymous trading route, got $code"; exit 1 ;; esac

              code=$(curl -s -o /tmp/setup-admin-anon.json -w "%{http_code}" -X POST -H "Content-Type: application/json" -d '{"email":"audit@example.invalid","password":"audit-only","nomeCompleto":"Audit"}' http://127.0.0.1:5123/api/setup-admin)
              case "$code" in 401|403) echo "Anonymous admin setup correctly denied: HTTP $code" ;; *) cat /tmp/setup-admin-anon.json; echo "Expected 401/403 for anonymous admin setup, got $code"; exit 1 ;; esac

              for route in clear-all-sessions reset-blocked-sessions increase-demo-limits; do
                code=$(curl -s -o "/tmp/anonymous-$route.json" -w "%{http_code}" -X POST "http://127.0.0.1:5123/api/auto-trading/$route")
                case "$code" in
                  401|403) echo "Anonymous destructive endpoint correctly denied: $route (HTTP $code)" ;;
                  *) cat "/tmp/anonymous-$route.json"; echo "Expected 401/403 for $route, got $code"; exit 1 ;;
                esac
              done

              code=$(curl -s -o /tmp/not-found.json -w "%{http_code}" http://127.0.0.1:5123/api/__audit_nonexistent__)
              test "$code" = "404" || { cat /tmp/not-found.json; echo "Expected 404 for unknown API route, got $code"; exit 1; }

              exit 0
            fi
            if ! kill -0 $pid 2>/dev/null; then
              echo "Server exited before /health became available."
              cat /tmp/invista-server.log
              exit 1
            fi
            sleep 1
          done
          echo "Server did not expose /health within 45 seconds."
          cat /tmp/invista-server.log
          exit 1
