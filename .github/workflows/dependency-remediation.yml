name: Dependency security remediation candidate

on:
  push:
    branches: [audit/e2e-ci-coverage-2026-10]

permissions:
  contents: write

concurrency:
  group: dependency-remediation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-lock:
    if: contains(github.event.head_commit.message, '[deps-audit-candidate]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile on isolated audit branch
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Clean install
        run: npm ci --include=dev
      - name: TypeScript
        run: npm run check
      - name: Application tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Capture full dependency audit report
        shell: bash
        run: |
          set +e
          npm audit --json > dependency-audit.json
          rc=$?
          set -e
          node -e 'const x=require("./dependency-audit.json"); console.log(JSON.stringify({metadata:x.metadata?.vulnerabilities, packages:Object.entries(x.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,isDirect:v.isDirect,fixAvailable:v.fixAvailable,via:v.via.map(y=>typeof y==="string"?y:{name:y.name,url:y.url,range:y.range})}))},null,2))'
          echo "npm audit exit code: $rc (development advisories are reported for review)"
      - name: Upload full dependency report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-audit
          path: dependency-audit.json
      - name: Commit regenerated lockfile to audit branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current; no commit needed."
            exit 0
          fi
          git commit -m "chore(deps): regenerate audited dependency lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
