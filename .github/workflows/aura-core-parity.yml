name: Invista Core Parity

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-aura-consumes-main-core:
    runs-on: ubuntu-latest
    env:
      AURA_REPO_TOKEN: ${{ secrets.AURA_REPO_TOKEN }}
    steps:
      - name: Checkout main platform
        uses: actions/checkout@v4

      - name: Report skipped parity check when private-repo credentials are not configured
        if: ${{ env.AURA_REPO_TOKEN == '' }}
        run: |
          echo "::warning::Cross-repository parity check skipped because AURA_REPO_TOKEN is not configured."
          echo "::warning::To run this check, add a fine-grained token with read-only Contents access to SkelleTu/InvistaPRO-V10-Aura-System-Style."

      - name: Checkout private Aura System Style
        if: ${{ env.AURA_REPO_TOKEN != '' }}
        uses: actions/checkout@v4
        with:
          repository: SkelleTu/InvistaPRO-V10-Aura-System-Style
          ref: main
          token: ${{ env.AURA_REPO_TOKEN }}
          path: /tmp/aura

      - name: Verify Aura wrapper points to canonical core
        if: ${{ env.AURA_REPO_TOKEN != '' }}
        run: |
          grep -q 'https://github.com/SkelleTu/InvistaPro-V10.git' /tmp/aura/package.json
          test -f /tmp/aura/package.json
          echo "OK: Aura System Style consumes InvistaPro-V10 as its canonical functional core."

      - name: Record canonical core SHA
        run: |
          echo "Canonical InvistaPro-V10 core: $GITHUB_SHA"
