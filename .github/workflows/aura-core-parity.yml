name: Invista Core Parity

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-aura-consumes-main-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main platform
        uses: actions/checkout@v4

      - name: Require read access to private Aura repository
        if: ${{ secrets.AURA_REPO_TOKEN == '' }}
        run: |
          echo "::error::Missing repository secret AURA_REPO_TOKEN. Add a fine-grained GitHub token with read-only Contents access to SkelleTu/Invista-PRO-V10-Aura-System-Style."
          exit 1

      - name: Checkout private Aura System Style
        uses: actions/checkout@v4
        with:
          repository: SkelleTu/Invista-PRO-V10-Aura-System-Style
          ref: main
          token: ${{ secrets.AURA_REPO_TOKEN }}
          path: /tmp/aura

      - name: Verify Aura wrapper points to canonical core
        run: |
          grep -q 'https://github.com/SkelleTu/InvistaPro-V10.git' /tmp/aura/package.json || grep -q 'https://github.com/SkelleTu/InvistaPro-V10.git' /tmp/aura/aura-build.mjs
          test -f /tmp/aura/aura-build.mjs
          echo "OK: Aura System Style consumes InvistaPro-V10 as its canonical functional core."

      - name: Record canonical core SHA
        run: |
          echo "Canonical InvistaPro-V10 core: $GITHUB_SHA"
