name: Observability Forensic Audit

on:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observability-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Static observability coverage audit
        run: node scripts/observability-audit.mjs

      - name: TypeScript validation
        run: npm run check

      - name: Production build validation
        run: npm run build

      - name: Verify production health endpoints
        env:
          PRODUCTION_URL: https://invista-pro-v10-aura-system-style.onrender.com
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 4 --retry-delay 3 "$PRODUCTION_URL/health" | tee /tmp/health.json
          node -e 'const x=require("/tmp/health.json"); if(x.status!=="ok" || x.routesReady!==true) { console.error(x); process.exit(1) }'
          curl --fail --silent --show-error --retry 4 --retry-delay 3 "$PRODUCTION_URL/api/observability/health" | tee /tmp/obs.json
          node -e 'const x=require("/tmp/obs.json"); if(!x.success || !x.status) { console.error(x); process.exit(1) }'

      - name: Verify production observability headers
        env:
          PRODUCTION_URL: https://invista-pro-v10-aura-system-style.onrender.com
        run: |
          set -euo pipefail
          headers=$(curl -sS -D - -o /dev/null "$PRODUCTION_URL/health")
          echo "$headers"
          echo "$headers" | grep -qi "^x-request-id:"
          echo "$headers" | grep -qi "^x-observability-trace-id:" || true

      - name: Verify deterministic API 404 instrumentation
        env:
          PRODUCTION_URL: https://invista-pro-v10-aura-system-style.onrender.com
        run: |
          code=$(curl -sS -o /tmp/404.json -w "%{http_code}" "$PRODUCTION_URL/api/__observability_audit_missing_route__")
          test "$code" = "404"
          node -e 'const x=require("/tmp/404.json"); if(x.success!==false || !x.error) { console.error(x); process.exit(1) }'
