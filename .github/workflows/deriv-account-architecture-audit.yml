name: Deriv Account Architecture Audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deriv-account-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Static Deriv architecture audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-artifacts
          python3 - <<'PY'
          from pathlib import Path
          exts={".ts",".tsx",".js",".jsx",".mjs",".cjs"}
          files=[p for p in Path(".").rglob("*") if p.is_file() and p.suffix in exts and "node_modules" not in p.parts and ".git" not in p.parts and "dist" not in p.parts]
          text="\n".join(f.read_text(errors="ignore") for f in files)
          required=["api.derivws.com","/otp","accountId","accountType","demo","real","Deriv-App-ID","deriv-account-gateway"]
          missing=[x for x in required if x not in text]
          forbidden=["ws.derivws.com/websockets/v3","ws.binaryws.com/websockets/v3","authorize:"]
          found_forbidden=[x for x in forbidden if x in text]
          Path("audit-artifacts/deriv-architecture-report.md").write_text(
              "# Deriv Account Architecture\n\n"
              f"Source files scanned: {len(files)}\n"
              f"Required markers missing: {missing}\n"
              f"Forbidden legacy markers found: {found_forbidden}\n"
          )
          print(Path("audit-artifacts/deriv-architecture-report.md").read_text())
          if missing or found_forbidden:
              raise SystemExit(1)
          PY

      - name: TypeScript validation
        run: |
          npm ci --ignore-scripts --no-audit
          npm exec -- tsc --noEmit

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deriv-account-audit-report
          path: audit-artifacts/
