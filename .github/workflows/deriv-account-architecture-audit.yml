name: Deriv Account Architecture Audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deriv-account-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate centralized Deriv account routing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-artifacts
          python3 - <<'PY'
          from pathlib import Path
          gateway=Path("server/services/deriv-account-gateway.ts").read_text()
          service=Path("server/services/deriv-api.ts").read_text()
          required_gateway=["https://api.derivws.com","/trading/v1/options/accounts","/otp","accountId","accountType","demo","real","Deriv-App-ID","Authorization"]
          missing=[x for x in required_gateway if x not in gateway]
          forbidden=[x for x in ["ws.derivws.com/websockets/v3","ws.binaryws.com/websockets/v3","authorize:"] if x in service]
          report=f"# Deriv Account Architecture\n\nGateway missing: {missing}\nLegacy markers in trading service: {forbidden}\n"
          Path("audit-artifacts/deriv-architecture-report.md").write_text(report)
          print(report)
          if missing or forbidden:
              raise SystemExit(1)
          PY

      - name: TypeScript validation
        run: |
          npm ci --ignore-scripts --no-audit
          npm exec -- tsc --noEmit

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deriv-account-audit-report
          path: audit-artifacts/
