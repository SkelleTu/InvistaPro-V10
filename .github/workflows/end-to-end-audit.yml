name: End-to-end platform audit

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-build:
    name: TypeScript, policy tests, dependency audit and production build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply compatible dependency security updates
        continue-on-error: true
        run: npm audit fix --package-lock-only --ignore-scripts
      - name: Commit updated lockfile to the pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: apply compatible dependency security updates"
            git push origin "HEAD:${BRANCH_NAME}"
          fi
      - name: Install locked dependencies
        run: npm ci --include=dev
      - name: TypeScript check
        run: npm run check
      - name: Production symbol policy tests
        run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Production build
        run: npm run build
      - name: Verify expected build artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -d dist
          test -s dist/index.js
          test -s dist/trading-user-worker.js
          echo "Production build artifacts verified."
